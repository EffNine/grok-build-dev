# CI: verify the fork's own test suite on every push/PR.
#
# The release workflow builds but never tests; this workflow is the
# regression gate. fmt/clippy start non-blocking (a 1.4M-LOC vendored
# fork may carry pre-existing violations) — tighten once clean.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install DotSlash (protoc wrapper)
        run: cargo install dotslash --locked

      - name: Format check (non-blocking for now)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy (non-blocking for now)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

      - name: Tests
        run: cargo test --workspace
